<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heart</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; overflow: hidden; background: #fff0f4; }
svg { width: 86vmin; height: 86vmin; overflow: visible; animation: beat 1.2s infinite ease-in-out; filter: drop-shadow(0 12px 25px #ff47754d); }
@keyframes beat { 0%, 100% { transform: scale(.88); } 15% { transform: scale(1.06); } 30% { transform: scale(.94); } 45% { transform: scale(1.08); } 65% { transform: scale(.88); } }
@media (prefers-reduced-motion: reduce) { svg { animation: none; } }
</style>
</head>
<body>
<svg viewBox="0 0 100 100" role="img" aria-label="跳動的愛心">
<defs><linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff7096"/><stop offset="1" stop-color="#e91e4d"/></linearGradient></defs>
<path fill="url(#pink)" d="M50 91 C42 83 3 57 3 30 C3 5 34 -3 50 20 C66 -3 97 5 97 30 C97 57 58 83 50 91Z"/>
</svg>
</body>
</html>
